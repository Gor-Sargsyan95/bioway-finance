<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioWay Finance — Тест</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    button { cursor: pointer; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-md max-w-sm w-full">
    <h1 class="text-2xl font-bold text-center text-pink-600 mb-4">BioWay Finance</h1>
    <p class="text-center text-gray-600 mb-6">Тест кнопки</p>
    <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded mb-3">
    <input id="password" type="password" placeholder="Пароль" class="w-full p-3 border rounded mb-4">
    <button id="regBtn" class="w-full bg-blue-600 text-white py-3 rounded font-medium">Зарегистрироваться</button>
    <p id="msg" class="text-sm text-red-600 mt-4 text-center"></p>
  </div>

  <script>
    document.getElementById('regBtn').addEventListener('click', function() {
      alert('Кнопка работает!');
      document.getElementById('msg').textContent = 'Кнопка нажата успешно';
    });
  </script>
</body>
</html>
