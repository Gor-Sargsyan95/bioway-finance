<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioWay Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-md mx-auto mt-10 card p-6">
    <h1 class="text-2xl font-bold text-center text-pink-600 mb-2">BioWay Finance</h1>
    <p class="text-center text-gray-600 mb-6">Учёт затрат и прибыли</p>
    <div id="msg" class="text-sm text-red-600 mb-3"></div>
    <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded mb-3">
    <input id="password" type="password" placeholder="Пароль" class="w-full p-3 border rounded mb-4">
    <button onclick="register()" class="w-full bg-blue-600 text-white py-3 rounded mb-2 font-medium">Зарегистрироваться</button>
    <button onclick="login()" class="w-full bg-pink-600 text-white py-3 rounded font-medium">Войти</button>
  </div>

  <div id="main" class="hidden max-w-4xl mx-auto mt-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold text-pink-600">BioWay Finance</h2>
      <button onclick="logout()" class="text-sm text-gray-600">Выйти</button>
    </div>
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="card p-3 text-center"><div class="text-xs text-gray-500">Затраты</div><div id="exp" class="text-xl font-bold text-red-600">0</div></div>
      <div class="card p-3 text-center"><div class="text-xs text-gray-500">Продажи</div><div id="sales" class="text-xl font-bold text-green-600">0</div></div>
      <div class="card p-3 text-center"><div class="text-xs text-gray-500">Прибыль</div><div id="profit" class="text-xl font-bold">0</div></div>
    </div>
    <div class="card p-4 mb-4">
      <select id="type" class="w-full p-2 border rounded mb-2"><option value="expense">Затрата</option><option value="sale">Продажа</option></select>
      <input id="amount" type="number" step="0.01" placeholder="Сумма" class="w-full p-2 border rounded mb-2">
      <input id="date" type="date" class="w-full p-2 border rounded mb-2">
      <select id="category" class="w-full p-2 border rounded mb-2">
        <option>Билеты</option><option>Подарки</option><option>Еда</option><option>Продукты и материалы</option><option>Продажи</option><option>Другое</option>
      </select>
      <input id="product" placeholder="Продукт" class="w-full p-2 border rounded mb-2">
      <input id="client" placeholder="Клиент" class="w-full p-2 border rounded mb-2">
      <input id="desc" placeholder="Комментарий" class="w-full p-2 border rounded mb-2">
      <input id="receipt" type="file" class="w-full mb-2">
      <button onclick="saveEntry()" class="w-full bg-pink-600 text-white py-2 rounded">Сохранить</button>
    </div>
    <div id="list" class="card p-4 space-y-2"></div>
  </div>

  <script>
    const SB_URL = 'https://loovgtthxkehwqegkmmi.supabase.co';
    const SB_KEY = 'sb_publishable_grMpbwsdZWvBjagEwFfhPQ_OEA3B2OE';
    let db = null;
    let user = null;

    function msg(t) { document.getElementById('msg').textContent = t || ''; }

    function client() {
      if (!window.supabase) { msg('Библиотека не загрузилась'); return null; }
      if (!db) db = window.supabase.createClient(SB_URL, SB_KEY);
      return db;
    }

    async function register() {
      const c = client(); if (!c) return;
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if (!email || pass.length < 6) return msg('Введите email и пароль (мин. 6 символов)');
      const { error } = await c.auth.signUp({ email, password: pass });
      if (error) return msg(error.message);
      alert('Регистрация успешна! Проверьте почту и подтвердите, затем войдите.');
    }

    async function login() {
      const c = client(); if (!c) return;
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if (!email || !pass) return msg('Введите email и пароль');
      const { data, error } = await c.auth.signInWithPassword({ email, password: pass });
      if (error) return msg(error.message);
      user = data.user;
      document.querySelector('.max-w-md').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      load();
    }

    async function logout() {
      if (db) await db.auth.signOut();
      location.reload();
    }

    async function saveEntry() {
      if (!db || !user) return alert('Нет входа');
      const amount = parseFloat(document.getElementById('amount').value);
      if (!amount) return alert('Введите сумму');
      const entry = {
        user_id: user.id,
        user_email: user.email,
        type: document.getElementById('type').value,
        amount,
        date: document.getElementById('date').value,
        category: document.getElementById('category').value,
        product: document.getElementById('product').value || null,
        client: document.getElementById('client').value || null,
        description: document.getElementById('desc').value || null,
        created_at: new Date().toISOString()
      };
      const file = document.getElementById('receipt').files[0];
      if (file) {
        const name = user.id + '/' + Date.now() + '_' + file.name;
        const { error } = await db.storage.from('receipts').upload(name, file);
        if (!error) entry.receipt_path = name;
      }
      const { error } = await db.from('entries').insert(entry);
      if (error) return alert(error.message);
      document.getElementById('amount').value = '';
      document.getElementById('product').value = '';
      document.getElementById('client').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('receipt').value = '';
      load();
    }

    async function load() {
      if (!db) return;
      const { data } = await db.from('entries').select('*').order('date', { ascending: false });
      const list = document.getElementById('list');
      list.innerHTML = '';
      let exp = 0, sales = 0;
      (data || []).forEach(e => {
        if (e.type === 'expense') exp += e.amount; else sales += e.amount;
        const d = document.createElement('div');
        d.className = 'border-b pb-2';
        d.innerHTML = '<div class="flex justify-between"><span>' + e.category + ' <small class="text-gray-400">' + e.date + '</small></span><b class="' + (e.type==='expense'?'text-red-600':'text-green-600') + '">' + (e.type==='expense'?'-':'+') + e.amount.toFixed(2) + '</b></div>';
        list.appendChild(d);
      });
      document.getElementById('exp').textContent = exp.toFixed(2);
      document.getElementById('sales').textContent = sales.toFixed(2);
      document.getElementById('profit').textContent = (sales - exp).toFixed(2);
    }
  </script>
</body>
</html>
